<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <title>Elite</title>
  <link rel="icon" type="image/png" href="%BASE_URL%brand/favicon.png" />
  <script>
    try {
      const lang = localStorage.getItem('elite-lang') || 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    } catch (_) {}
  </script>
  <style>
    html, body { margin: 0; min-height: 100%; background: #050507; }
    #app-loader {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; background: #050507; isolation: isolate;
      opacity: 1; visibility: visible; transition: opacity 850ms cubic-bezier(.22, 1, .36, 1), visibility 850ms;
    }
    #app-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .app-loader-glows { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .app-loader-glow { position: absolute; width: 60vw; height: 60vw; min-width: 340px; min-height: 340px; border-radius: 50%; background: #d90f26; filter: blur(110px); opacity: .22; top: 50%; left: 50%; translate: -50% -50%; animation: loader-drift 14s ease-in-out infinite alternate; }
    @keyframes loader-drift { to { transform: scale(1.14); opacity: .12; } }
    .app-loader-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 26px; width: min(240px, 68vw); }
    .app-loader-mark { width: 150px; height: auto; color: #fff; }
    .app-loader-track { width: 100%; height: 3px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, .14); }
    .app-loader-bar { height: 100%; width: 42%; border-radius: inherit; background: linear-gradient(90deg, #d90f26, #ff4455); box-shadow: 0 0 15px rgba(255, 68, 85, .7); animation: loader-sweep 1.6s ease-in-out infinite; }
    @keyframes loader-sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
    @media (prefers-reduced-motion: reduce) {
      .app-loader-glow, .app-loader-bar { animation: none; }
      .app-loader-bar { transform: none; width: 100%; }
      #app-loader { transition-duration: .15s; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Ubuntu:wght@500&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
</head>
<body>
  <div id="app-loader" role="status" aria-label="Loading Elite" aria-live="polite">
    <div class="app-loader-glows" aria-hidden="true"><span class="app-loader-glow"></span></div>
    <div class="app-loader-content">
      <svg class="app-loader-mark" viewBox="0 0 248 52" aria-hidden="true" focusable="false"><g fill="currentColor">
        <rect x="0" y="0" width="52" height="13" /><rect x="0" y="19.5" width="52" height="13" /><rect x="0" y="39" width="52" height="13" />
        <rect x="70" y="0" width="13" height="52" /><rect x="58" y="39" width="52" height="13" />
        <rect x="116" y="0" width="13" height="52" />
        <rect x="136" y="0" width="53" height="13" /><rect x="159" y="0" width="13" height="52" />
        <rect x="196" y="0" width="52" height="13" /><rect x="196" y="19.5" width="52" height="13" /><rect x="196" y="39" width="52" height="13" />
      </g></svg>
      <div class="app-loader-track" aria-hidden="true"><div class="app-loader-bar"></div></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
