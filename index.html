<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <script>var m="night";try{if(localStorage.getItem("plato-hero")==="day")m="day"}catch(e){}document.documentElement.dataset.hero=m</script>
  <meta name="theme-color" content="#0a0d33" />
  <script>try{if(document.documentElement.dataset.hero==="day")document.querySelector('meta[name="theme-color"]').setAttribute("content","#283695")}catch(e){}</script>
  <title>Plato AR</title>
  <link rel="icon" type="image/png" href="%BASE_URL%brand/favicon.png" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="apple-touch-icon" href="%BASE_URL%brand/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Plato AR" />
  <script>
    try {
      const lang = localStorage.getItem('elite-lang') || 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    } catch (_) {}
  </script>
  <style>
    html, body { margin: 0; min-height: 100%; background: #070a26; }
    #app-loader {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; background: #070a26; isolation: isolate;
      opacity: 1; visibility: visible; transition: opacity 850ms cubic-bezier(.22, 1, .36, 1), visibility 850ms;
    }
    #app-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .app-loader-glows { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .app-loader-glow { position: absolute; width: 60vw; height: 60vw; min-width: 340px; min-height: 340px; border-radius: 50%; background: #5b5ff0; filter: blur(110px); opacity: .22; top: 50%; left: 50%; translate: -50% -50%; animation: loader-drift 14s ease-in-out infinite alternate; }
    @keyframes loader-drift { to { transform: scale(1.14); opacity: .12; } }
    .app-loader-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 26px; width: min(240px, 68vw); }
    .app-loader-mark { width: 190px; max-width: 100%; height: auto; display: block; }
    .app-loader-track { width: 100%; height: 3px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, .14); }
    .app-loader-bar { height: 100%; width: 42%; border-radius: inherit; background: linear-gradient(90deg, #5b5ff0, #8fb2ff); box-shadow: 0 0 15px rgba(143,178,255, .7); animation: loader-sweep 1.6s ease-in-out infinite; }
    @keyframes loader-sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
    @media (prefers-reduced-motion: reduce) {
      .app-loader-glow, .app-loader-bar { animation: none; }
      .app-loader-bar { transform: none; width: 100%; }
      #app-loader { transition-duration: .15s; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Ubuntu:wght@500&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
</head>
<body>
  <div id="app-loader" role="status" aria-label="Loading Plato AR" aria-live="polite">
    <div class="app-loader-glows" aria-hidden="true"><span class="app-loader-glow"></span></div>
    <div class="app-loader-content">
      <img class="app-loader-mark" src="%BASE_URL%brand/plato-ar-white.png" alt="" draggable="false" />
      <div class="app-loader-track" aria-hidden="true"><div class="app-loader-bar"></div></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
