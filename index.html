<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <script>var m="night";try{if(localStorage.getItem("plato-hero")==="day")m="day"}catch(e){}document.documentElement.dataset.hero=m</script>
  <script>try{var d=document.documentElement.dataset.hero==="day",ph=matchMedia("(max-width:767px)").matches,l=document.createElement("link");l.rel="preload";l.as="image";l.href="%BASE_URL%art/hero2-bg"+(ph?"-m":"")+(d?"":"-night")+".webp";l.setAttribute("fetchpriority","high");document.head.appendChild(l)}catch(e){}</script>
  <meta name="description" content="Plato AR: مجتمع بلاتو العربي. بطولات، ألعاب، أخبار وتسجيل. Arabic Plato community: tournaments, games, news and sign-ups." />
  <meta name="theme-color" content="#0a0d33" />
  <script>try{if(document.documentElement.dataset.hero==="day")document.querySelector('meta[name="theme-color"]').setAttribute("content","#283695")}catch(e){}</script>
  <title>Plato AR</title>
  <link rel="icon" type="image/png" href="%BASE_URL%brand/favicon-v2.png" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="apple-touch-icon" href="%BASE_URL%brand/apple-touch-icon-v2.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Plato AR" />
  <script>
    try {
      const lang = localStorage.getItem('elite-lang') || 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    } catch (_) {}
  </script>
  <style>
    html, body { margin: 0; min-height: 100%; background: #070a26; }
    #root { display: flow-root; min-height: 100vh; min-height: 100svh; }
    html[data-hero='day'], html[data-hero='day'] body { background: #f4eefc; }
    .startup-fallback { max-width: 34rem; margin: 18vh auto 0; padding: 1.5rem; color: #fff; font: 16px system-ui,sans-serif; text-align: center; }
    html[data-hero='day'] .startup-fallback { color: #231a63; }
    .startup-fallback a { color: inherit; text-decoration: underline; }
    #root > .startup-fallback:not(.startup-error) { visibility: hidden; animation: show-startup-fallback 0s 15s forwards; }
    @keyframes show-startup-fallback { to { visibility: visible; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Ubuntu:wght@500&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
</head>
<body>
  <div id="root">
    <main class="startup-fallback">
      <p lang="ar" dir="rtl">تعذّر تشغيل الموقع. أعد تحميل الصفحة.</p>
      <p lang="en">The site did not start. Reload the page.</p>
      <a href="">إعادة التحميل · Reload</a>
    </main>
  </div>
  <noscript><p class="startup-fallback">يتطلب الموقع JavaScript · This site requires JavaScript.</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
